# Configuration comes from `.env` (copy `.env.example` to `.env` FIRST - this
# file refuses to load without `ENVIO_API_TOKEN` and `ADMIN_PASSWORD`).
#
# No secret is written in this file. Everything sensitive is interpolated from
# `.env`, which is git-ignored.
#
# One ClickHouse database holds every chain. Two ways to run it:
#
#   * `indexer fleet` - ONE process for every chain, with the password
#     protected web control panel. This is the `fleet` service below and the
#     one the README's quick start uses.
#   * ONE indexer process per chain - `x-indexer` is the shared definition and
#     the commented-out `indexer-ethereum` / `indexer-solana` services at the
#     bottom show the shape. Useful for a chain that needs its own HyperSync
#     endpoint, which is not a per-chain setting in the fleet.
#
# Do not index the SAME chain both ways at once: the per-chain lease refuses
# the second process, and the panel shows it as "running elsewhere".

# Shared by every indexer service (YAML merge key: `<<: *indexer`).
x-indexer: &indexer
  build:
    context: .
    dockerfile: Dockerfile
  # One image for all chains: the first service builds it, the others reuse it.
  image: evm-indexer:local
  depends_on:
    clickhouse:
      condition: service_healthy
    dragonfly:
      condition: service_healthy
  env_file:
    - path: .env
      required: false
  healthcheck:
    # GET /healthz on the metrics port. The runtime image has no curl / wget,
    # bash's /dev/tcp does the job without adding packages.
    test:
      - CMD
      - bash
      - -c
      - exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
    interval: 15s
    timeout: 5s
    retries: 4
    # Startup applies pending schema migrations before the endpoint is served.
    start_period: 60s
  networks:
    - indexer-network
  restart: unless-stopped

# `environment` wins over `.env`: inside compose the indexer always talks to
# the bundled ClickHouse and Dragonfly services. The indexer creates the
# database named in DATABASE_URL and all of its tables itself (embedded,
# versioned migrations), nothing is mounted into ClickHouse.
x-indexer-environment: &indexer-environment
  ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:?Set ENVIO_API_TOKEN in .env - get one at https://docs.envio.dev/docs/HyperSync/api-tokens}
  DATABASE_URL: http://${CLICKHOUSE_USER:-indexer}:${CLICKHOUSE_PASSWORD:-indexer}@clickhouse:8123/${CLICKHOUSE_DB:-indexer}
  REDIS_URL: redis://dragonfly:6379
  # Same port inside every container; each service publishes it on its own
  # host port below.
  METRICS_ADDR: 0.0.0.0:9090

services:
  clickhouse:
    # 25.8 is a ClickHouse LTS release line.
    image: clickhouse/clickhouse-server:25.8
    container_name: evm-indexer-clickhouse
    ports:
      # Published on localhost only. Change to "8123:8123" to expose it.
      - "127.0.0.1:8123:8123" # HTTP interface (used by the indexer)
      - "127.0.0.1:9000:9000" # native protocol (clickhouse-client)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      # Only the account. The database (CLICKHOUSE_DB, used in DATABASE_URL)
      # and the tables are created by the indexer.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-indexer}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-indexer}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Pinged through the container hostname, not 127.0.0.1: a temporary
      # bootstrap server of the image's entrypoint (localhost only) can then
      # never be mistaken for the real one.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname):8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - indexer-network
    restart: unless-stopped

  dragonfly:
    # Redis-compatible cache for token metadata (name / symbol / decimals),
    # shared by all chains (keys are namespaced by chain id). Optional: the
    # indexer falls back to an in-memory cache when REDIS_URL is unset.
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    container_name: evm-indexer-dragonfly
    # Dragonfly needs 256MB of maxmemory per thread, so keep both in step.
    command:
      - dragonfly
      - --logtostderr
      - --cache_mode=true
      - --proactor_threads=2
      - --maxmemory=1gb
    ulimits:
      memlock: -1
    # It is only a cache, so no volume: an empty cache is refilled on demand.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - indexer-network
    restart: unless-stopped

  # ------------------------------------------------------------------
  # ONE process, EVERY chain, with the control panel. This is the default.
  #
  #   docker compose up -d --build fleet
  #
  # The panel is published on 127.0.0.1:${ADMIN_PORT:-8090} - localhost of THIS
  # host and nothing else. It speaks plain HTTP; to reach it from another
  # machine use an SSH tunnel (`ssh -N -L 8090:127.0.0.1:8090 you@host`) or a
  # TLS reverse proxy, see the README.
  #
  # WORTH KNOWING: inside the compose network the panel listens on
  # 0.0.0.0:8090, so ClickHouse, Dragonfly and any sidecar you add can reach it
  # directly - the host publish only controls who gets in from OUTSIDE. It is
  # still password protected, but if you add containers you do not fully trust,
  # put the fleet on its own internal network with the proxy and leave the
  # shared one to the database.
  fleet:
    <<: *indexer
    container_name: evm-indexer-fleet
    environment:
      <<: *indexer-environment
      # Read by the panel itself, never by the command line: it must not be
      # visible in `ps`. At least 12 characters; `openssl rand -base64 18`.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (at least 12 characters - openssl rand -base64 18) to switch the control panel on}
      # Inside the container; published on the host below.
      ADMIN_ADDR: 0.0.0.0:8090
      # Per-chain settings come from the fleet_chains table and the panel, NOT
      # from .env: CHAIN_ID, START_BLOCK and friends are ignored here.
    command:
      # Only needed while the fleet_chains table is still empty. After the
      # first start the panel's "Add a chain" button is the place to add them,
      # and this list can be trimmed to nothing.
      - fleet
      - --chain
      - "1"
      - --chain
      - "8453"
      - --chain
      - solana
      # The panel is reached through Compose's port mapping, not from inside
      # the container, so it has to be allowed to bind 0.0.0.0.
      - --admin-allow-remote
    ports:
      - "127.0.0.1:${METRICS_PORT:-9101}:9090" # every chain, one endpoint
      - "127.0.0.1:${ADMIN_PORT:-8090}:8090"   # the control panel

  # ------------------------------------------------------------------
  # ONE PROCESS PER CHAIN - the alternative to `fleet`, and the only way to
  # give a single chain its own HyperSync endpoint. Uncomment what you need and
  # stop indexing those chains in the fleet (remove them from its --chain list
  # and from the fleet_chains table through the panel).
  #
  # Values set under `environment` win over `.env`, so everything chain
  # specific has to be set per service.
  #
  # indexer-ethereum:
  #   <<: *indexer
  #   container_name: evm-indexer-ethereum
  #   environment:
  #     <<: *indexer-environment
  #     CHAIN_ID: 1
  #     # START_BLOCK / START_DATE are read on the FIRST start of a chain only:
  #     # they fix the coverage floor. Leave them out for one year of history.
  #     #START_DATE: 2024-01-01
  #     # A private HyperSync endpoint for this chain only:
  #     #HYPERSYNC_URL: https://my-private-endpoint.example
  #   ports:
  #     - "127.0.0.1:9102:9090"
  #
  # indexer-solana:
  #   <<: *indexer
  #   container_name: evm-indexer-solana
  #   environment:
  #     <<: *indexer-environment
  #     CHAIN_ID: solana
  #     # Solana starts at the head by default; --start-block is a SLOT and
  #     # must be at least 391000000.
  #     RPC_URL: none        # Solana needs no eth_call; decimals come with the data
  #   ports:
  #     - "127.0.0.1:9103:9090"

volumes:
  clickhouse_data:
    driver: local

networks:
  indexer-network:
    driver: bridge
