[package]
name = "evm-indexer"
version = "3.0.0"
license = "MIT"
edition = "2021"
repository = "https://github.com/eabz/evm-indexer"
description = "Scalable SQL indexer for EVM compatible blockchains"

[dependencies]
alloy = { version = "1", default-features = false, features = ["std", "providers", "reqwest", "reqwest-rustls-tls", "rpc-types", "sol-types"] }
anyhow = "1"
# The control panel (`indexer fleet`, src/admin). Minimal feature set: no
# multipart, no forms, no query strings, no tracing - the panel speaks JSON
# over HTTP/1.1 and nothing else.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
clickhouse = { version = "0.14", features = ["native-tls"] }
futures = "0.3"
# The control panel's accept loop (src/admin/server.rs). `axum::serve` sets
# no timeout and no connection cap, and the panel lives in the process that
# indexes every chain, so the loop is hyper's own with limits added.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "service", "tokio"] }
tower = { version = "0.5", default-features = false }
# Session tokens and the password salt come from the operating system's
# CSPRNG, never from a hash of the clock (src/admin/auth.rs).
getrandom = "0.3"
hex = "0.4"
hypersync-client = "1.4"
log = "0.4"
lru = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha2 = "0.10"
simple_logger = { version = "5", default-features = false, features = ["colors"] }
# Constant-time equality for the admin password hash and the session token
# (src/admin/auth.rs). Zero dependencies, one job, easy to audit.
subtle = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
hypersync-client-solana = "0.2"
bs58 = "0.5"
hypersync-solana-net-types = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[[bin]]
path = "bin/indexer.rs"
name = "indexer"
