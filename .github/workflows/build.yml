name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Unit tests, the layout test and the doc tests. Everything that needs a
      # service or the network is `#[ignore]`d (see the `integration` job).
      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

  # Every `#[ignore]`d suite that needs a real ClickHouse. They go through the
  # embedded migrations, so this job is also what proves that a fresh database
  # can be created by the binary alone.
  #
  # ONE MATRIX ENTRY PER SUITE, each with its OWN ClickHouse service container
  # and its OWN `<name>_test` database. That is deliberate: the suites create
  # throwaway databases as they go, and a single server collecting all of them
  # runs into its memory limit long before the tests are at fault. A fresh
  # server per suite also means one suite can never leave state for another,
  # and the matrix keeps the wall-clock time of the job at the slowest suite
  # rather than the sum.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The infrastructure: insert path, tombstones, epochs, the validity
          # rule, missing ranges, and the migrator (which is also the only
          # suite that needs Redis, for the token cache round trip).
          - name: core
            filter: "db::integration_tests:: db::migrate::integration:: redis_round_trip_and_restart"
          # The end-to-end sync loops: crash matrices, gap heals, reorgs.
          - name: acceptance
            filter: "pipeline::acceptance::"
          - name: solana_acceptance
            filter: "pipeline::solana_acceptance::"
          # The data modules.
          - name: dex
            filter: "dex::integration_tests::"
          - name: predictions
            filter: "predictions::integration_tests::"
          - name: launchpads
            filter: "launchpads::integration_tests::"
          # `svm::integration_tests::` in full, NEVER the bare filter `svm::`:
          # that would also select `svm::live_tests`, which need an Envio token
          # and the network.
          - name: svm
            filter: "svm::integration_tests::"
          # The fleet supervisor against a real `fleet_chains` table.
          - name: fleet
            filter: "fleet::integration_tests::"
    services:
      clickhouse:
        # Keep in step with docker-compose.yml.
        #
        # `db::migrate::integration` needs a server with a WRITABLE access
        # storage: `least_privilege_user_starts_only_when_nothing_is_pending`
        # runs `CREATE USER ... GRANT SELECT, INSERT` to prove that a
        # least-privilege user can start once the migrations are applied.
        # This image ships a `<user_directories>` with a `<local_directory>`
        # (/var/lib/clickhouse/access/), which is what makes that possible;
        # a server configured with `users_xml` alone refuses with "there are
        # no writable access storages". CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
        # then gives CLICKHOUSE_USER the right to use it.
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: indexer
          CLICKHOUSE_PASSWORD: indexer
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The suites DROP and recreate this database, so its name MUST end in
      # `_test`; some of them also create throwaway databases of their own on
      # the same server.
      TEST_DATABASE_URL: http://indexer:indexer@localhost:8123/${{ matrix.name }}_test
      TOKEN_CACHE_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The filters are substring matches on the test path, any of them selects
      # a test. Deliberately NOT selected anywhere (they need the internet or a
      # token): `tokens::*::live_*` (chainid.network, public RPCs,
      # TOKEN_TEST_RPC_URL), `svm::live_tests::` and
      # `unreachable_redis_never_stalls_or_fails`.
      #
      # `--test-threads=1`: these suites share one server and assert on row
      # counts, so they are not safe to interleave.
      - name: Integration tests (${{ matrix.name }})
        run: cargo test --locked --lib -- --ignored --test-threads=1 ${{ matrix.filter }}

      # Give the server its memory back even when a suite failed, so the
      # teardown of the runner is not what reports the problem.
      - name: Drop the test databases
        if: always()
        run: |
          for db in $(curl -fsS 'http://indexer:indexer@localhost:8123/?query=SHOW+DATABASES' || true); do
            case "$db" in
              *_test|*_test_*)
                curl -fsS "http://indexer:indexer@localhost:8123/?query=DROP+DATABASE+IF+EXISTS+%60$db%60" || true
                ;;
            esac
          done

  # The image is only published from main (docker.yml); this catches a broken
  # Dockerfile / .dockerignore (e.g. build.rs not finding migrations/) on the
  # pull request instead.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: evm-indexer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm evm-indexer:ci --version
          docker run --rm evm-indexer:ci migrate --help
          docker run --rm evm-indexer:ci fleet --help
